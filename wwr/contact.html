<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Splash White Water Raft to ask questions, book a rafting trip, or meet our team of experienced river guides.">
    <meta name="author" content="Ukpabi Harrison">
    <title>Contact Us | Splash White Water Raft</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="white water raft">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Splash White Water Raft</h1>

        <address>
            123 Main River Street<br>
            Kolob, California<br>
            <a href="tel:+19999999999">+1 999 999 9999</a><br>
            <a href="mailto:info@whitewater.com">info@whitewater.com</a>
        </address>

        <div class="contact-layout">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d60298.36506980087!2d-113.15530085701842!3d37.4124717713994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1791807062318!5m2!1sen!2sng"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form action="#" method="post">
                <p>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                      required>
                </p>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation
                        Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type here"></textarea>
                </p>

                <p>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes"> Please
                        subscribe me to
                        the monthly newsletter
                    </label>

                </p>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Portrait of Maria Lopez, head river guide">
                <figcaption>Maria Lopez, Head River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="Portrait of James Carter, operations manager">
                <figcaption>James Carter, Operations Manager</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg"
                  alt="Portrait of Aisha Bello, customer service lead">
                <figcaption>Aisha Bello, Customer Service Lead</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Splash White Water Raft | Ukpabi Harrison.</p>
        <nav class="socialmedia">
            <a href="https://web.facebook.com/"><img src="images/facebook.jpeg"
                  alt="Facebook page"></a>
            <a href="https://www.tiktok.com"><img src="images/tiktok.jpeg" alt="TikTok profile"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin.jpeg"
                  alt="LinkedIn profile"></a>
        </nav>
    </footer>
</body>

</html>
